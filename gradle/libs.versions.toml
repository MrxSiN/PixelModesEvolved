[versions]
agp = "9.3.1"
kotlin = "2.4.10"
libxposed = "102.0.0"
# Material 3 Expressive ships through the material3 1.5.0 alpha line. Pinned over
# the Compose BOM, which would otherwise resolve material3 to 1.4.0.
m3 = "1.5.0-alpha27"
compose-bom = "2026.08.00"
activity = "1.13.0"
maplibre = "13.6.1"
junit = "4.13.2"
json = "20250517"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "m3" }
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
